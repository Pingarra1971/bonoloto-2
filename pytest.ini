[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: tests que tardan >10s (cálculo pipeline completo)
    integration: tests con dependencias externas (BD, FastAPI client)
    unit: tests unitarios puros
filterwarnings =
    ignore::DeprecationWarning
