name: Construir APK (app Android)

on:
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generar el proyecto Android
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name bonoloto_2 --org com.pingarra

      - name: Forzar compileSdk 36
        run: |
          KTS=android/app/build.gradle.kts
          GRADLE=android/app/build.gradle
          if [ -f "$KTS" ]; then
            sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]*=.*/\1compileSdk = 36/' "$KTS"
            echo "---- $KTS ----"; grep -n "compileSdk" "$KTS" || true
          fi
          if [ -f "$GRADLE" ]; then
            sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]+.*/\1compileSdk 36/' "$GRADLE"
            echo "---- $GRADLE ----"; grep -n "compileSdk" "$GRADLE" || true
          fi

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar el APK
        run: flutter build apk --debug

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: bonoloto-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error