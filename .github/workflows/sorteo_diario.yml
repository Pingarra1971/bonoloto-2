name: Combinaciones diarias Bonoloto

# Cuándo se ejecuta:
#  - Cada día a las 22:00 UTC = 23:00 hora de España (medianoche en verano).
#    Así deja margen de sobra tras el sorteo de las 21:30 por si hay retrasos.
#  - Y también a mano, con el botón "Run workflow" en la pestaña Actions.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

# Necesario para que la tarea pueda guardar (commit) el resultado en el repo.
permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar las combinaciones del día
        env:
          LOTERIAS_API_KEY: ${{ secrets.LOTERIAS_API_KEY }}
          CANTIDAD_COMBINACIONES: "5"
        run: python scripts/generar_diario.py

      - name: Publicar el resultado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/combinaciones.json
          git commit -m "Combinaciones del dia $(date -u +%Y-%m-%d)" || echo "Sin cambios que publicar"
          git push
