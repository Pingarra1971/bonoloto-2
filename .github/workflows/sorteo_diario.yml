name: Combinaciones diarias Bonoloto

# Cuándo se ejecuta:
#  - Por la noche a las 22:23 UTC = 00:23 hora de España (verano) / 23:23
#    (invierno). Minuto "raro" (no en punto): GitHub retrasa menos esas tareas.
#  - De RESPALDO por la mañana a las 05:17 UTC = 07:17 España (verano) /
#    06:17 (invierno), por si la de la noche se retrasó o se saltó.
#  - Y también a mano, con "Run workflow" en la pestaña Actions.
on:
  schedule:
    - cron: "23 22 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch: {}

# Permisos: 'contents' para guardar el JSON; 'issues' para avisar si algo falla.
permissions:
  contents: write
  issues: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar las combinaciones del día
        env:
          LOTERIAS_API_KEY: ${{ secrets.LOTERIAS_API_KEY }}
          CANTIDAD_COMBINACIONES: "20"
        run: python scripts/generar_diario.py

      - name: Validar el JSON antes de publicar
        # Si el JSON saliera incompleto o roto, FALLA aquí y NO publica nada
        # (la app sigue con el JSON anterior, nunca se queda sin datos).
        run: |
          python - << 'PY'
          import json, sys
          try:
              j = json.load(open("docs/combinaciones.json", encoding="utf-8"))
          except Exception as e:
              print("JSON no se puede leer:", e); sys.exit(1)
          fallos = []
          for k in ("generado", "fecha_sorteo", "ultimo_sorteo",
                    "combinaciones", "estadisticas"):
              if k not in j or j[k] is None:
                  fallos.append(f"falta '{k}'")
          if not j.get("combinaciones"):
              fallos.append("'combinaciones' está vacío")
          us = j.get("ultimo_sorteo") or {}
          if len(us.get("numeros") or []) != 6:
              fallos.append("ultimo_sorteo no tiene 6 números")
          if fallos:
              print("JSON INVÁLIDO:", "; ".join(fallos)); sys.exit(1)
          print(f"JSON OK: {len(j['combinaciones'])} combinaciones, "
                f"último sorteo {us.get('fecha')}.")
          PY

      - name: Publicar el resultado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/combinaciones.json
          [ -f data/bonoloto_historico.csv ] && git add data/bonoloto_historico.csv
          [ -f data/historial_aciertos.json ] && git add data/historial_aciertos.json
          git commit -m "Combinaciones del dia $(date -u +%Y-%m-%d)" || echo "Sin cambios que publicar"
          git push

      - name: Avisar si algo ha fallado
        # Solo se ejecuta si algún paso anterior falló. Crea una incidencia
        # (issue) en el repo; GitHub te avisa por correo/notificación.
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fecha = new Date().toISOString().slice(0, 10);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ La tarea diaria de Bonoloto ha fallado (${fecha})`,
              body: `La generación diaria del JSON ha fallado.\n\nMira el paso en rojo aquí: ${url}\n\nTranquilo: el JSON anterior sigue publicado, así que la app no se queda sin datos.`
            });
